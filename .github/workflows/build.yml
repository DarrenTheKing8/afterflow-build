name: Build Afterflow
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android64, Android32]
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q afterflow-fixed.zip
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          path: afterflow-android-port
          sdk: v5.10.1
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: afterflow-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}
